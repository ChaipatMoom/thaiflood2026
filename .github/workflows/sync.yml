name: Hourly Water Data Sync

on:
  schedule:
    # รันอัตโนมัติทุกๆ ต้นชั่วโมง (นาทีที่ 15)
    - cron: '15 * * * *'
  workflow_dispatch: # เพิ่มปุ่มกดรันมือเพื่อทดสอบได้ทันที

jobs:
  sync-water-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Water Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sync_water.py
